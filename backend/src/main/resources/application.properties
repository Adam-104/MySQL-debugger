spring.application.name=mysql-debugger

# Hosting platforms (Render, Railway, Heroku-style) provide PORT; locally it stays 8080
server.port=${PORT:${SERVER_PORT:8080}}

# Override with environment variables in real deployments (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mysql_debugger}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fail fast if a query hangs
spring.datasource.hikari.connection-timeout=30000

# Frontend hosted elsewhere (e.g. Vercel): comma-separated origins allowed to call /api, * wildcard allowed.
# Leave empty when the frontend is served by this app.
app.cors.allowed-origins=${APP_CORS_ORIGINS:}

# Smaller responses, and a small connection pool that suits free-tier hosts
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=1024
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=1500000
