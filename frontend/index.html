<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MySQL Query Debugger</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e8a'/%3E%3Cpath d='M9 11l6 5-6 5M17 22h7' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="description" content="Paste a MySQL query and see how MySQL runs it, why it is slow, and which index would fix it. Your statement is never executed." />
    <meta name="theme-color" content="#0b6e8a" />
    <script>
      try {
        var t = localStorage.getItem('mysql-debugger:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
